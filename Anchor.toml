[toolchain]
# Pinned deliberately. Anchor 1.1.2's CI tests against Agave 3.1.10; the current
# Agave stable line is 4.x and is NOT tested against this Anchor version. Running
# `avm solana install` reads these values.
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Set by `anchor keys sync`. The matching keypair lives at
# target/deploy/rubric-keypair.json and is gitignored - BACK IT UP, because
# losing it means you can never upgrade a program deployed under this id.
rubric = "F2Uo5JUfGQtho8s9ZbwcpWBd8iJ4XvBqamUaqdjcrRxz"

[programs.devnet]
rubric = "F2Uo5JUfGQtho8s9ZbwcpWBd8iJ4XvBqamUaqdjcrRxz"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

[hooks]
