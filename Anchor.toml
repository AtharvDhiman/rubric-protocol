[toolchain]
# Pinned deliberately. Anchor 1.1.2's CI tests against Agave 3.1.10; the current
# Agave stable line is 4.x and is NOT tested against this Anchor version. Running
# `avm solana install` reads these values.
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Set by `anchor keys sync`. The matching keypair lives at
# target/deploy/rubric-keypair.json and is gitignored. It is needed to DEPLOY this
# address for the first time on a cluster, and for nothing after that: upgrades are
# authorised by the program's UPGRADE AUTHORITY, not by this key. (Tested: deploy,
# delete the keypair, upgrade with only the public address - it works, and an
# upgrade by any other authority is refused.) What to protect once it is deployed is
# the upgrade authority.
rubric = "F2Uo5JUfGQtho8s9ZbwcpWBd8iJ4XvBqamUaqdjcrRxz"

[programs.devnet]
rubric = "F2Uo5JUfGQtho8s9ZbwcpWBd8iJ4XvBqamUaqdjcrRxz"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
# The program under test MUST be deployed upgradeable. `initialize_config` accepts
# only the program's upgrade authority as signer - that is the fix for the init
# land-grab - so a program deployed immutable has no authority at all, nothing can
# ever initialise it, and the whole suite dies in `before all` with a baffling
# NotAdmin. anchor-cli 1.1.2 deploys immutable unless this is set, and a missing
# [test] table counts as "not set". (docs/security-review.md, R-12)
upgradeable = true

[test.validator]
url = "https://api.devnet.solana.com"

[hooks]
