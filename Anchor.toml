[toolchain]
# Pinned deliberately. Anchor 1.1.2's CI tests against Agave 3.1.10; the current
# Agave stable line is 4.x and is NOT tested against this Anchor version. Running
# `avm solana install` reads these values.
anchor_version = "1.1.2"
solana_version = "3.1.10"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# PLACEHOLDER. Run `anchor keys sync` after the first build - it generates the
# program keypair, then rewrites this line and `declare_id!` in lib.rs to match.
rubric = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
rubric = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

[hooks]
